default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: fmt
        name: fmt
        language: system
        types: [rust]
        entry: cargo fmt
        pass_filenames: false
      - id: clippy
        name: clippy
        language: system
        types: [rust]
        entry:
          cargo clippy --all-targets --all-features -- -D warnings -W
          clippy::all -W clippy::cargo -W clippy::complexity -W
          clippy::correctness -W clippy::pedantic -W clippy::perf -W
          clippy::style -W clippy::suspicious
        pass_filenames: false
      - id: doc
        name: doc
        language: system
        types: [rust]
        entry: cargo doc --no-deps --all-features
        pass_filenames: false
      - id: oxfmt
        name: oxfmt
        language: system
        entry: bunx --bun oxfmt@latest --ignore-path .oxfmtignore
        pass_filenames: false
